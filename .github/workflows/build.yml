name: Build PC Remote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC program
        shell: pwsh
        run: dotnet build server/PCRemote.csproj -c Release -p:Version=1.0.${{ github.run_number }}
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item server/bin/Release/net48/PCRemote.exe out/PCRemote.exe
          Get-ChildItem server/bin/Release/net48
      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: out/PCRemote.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone app
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/PCRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/PCRemote.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PC Remote 1.0.${{ github.run_number }}
          body: |
            **Phone:** download PCRemote.apk and open it to install (or tap Update inside the app).
            **PC:** download PCRemote.exe and run it once. It installs itself, starts with Windows and sits in the system tray.
          files: |
            out/PCRemote.apk
            out/PCRemote.exe
          make_latest: true
